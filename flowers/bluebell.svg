    <!-- Main Bell -->
    <path d="M92,85 C75,95 60,120 70,140 C80,148 95,148 102,142 C108,125 105,105 92,85 Z"/>
    <!-- Recurved Bell Tips -->
    <path d="M70,140 Q62,145 60,152"/>
    <path d="M85,146 Q85,154 85,160"/>
    <path d="M102,142 Q108,148 115,152"/>

    <!-- Secondary Upper Bell -->
    <path d="M110,55 C95,65 85,85 92,100 C100,106 112,105 118,100 C122,86 120,70 110,55 Z" fill="#c7d2fe"/>
  </g>

  <!-- Protruding Pale Yellow Anthers -->
  <line x1="86" y1="145" x2="86" y2="158" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="86" cy="159" r="2" fill="#ca8a04"/>
</svg>