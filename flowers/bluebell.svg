<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Watercolor Wash -->
  <path d="M65,45 Q110,30 135,65 Q160,115 130,155 Q85,175 60,140 Q45,95 65,45 Z" fill="#a5b4fc" opacity="0.45"/>
  <path d="M75,60 Q120,50 125,95 Q130,140 90,150 Q65,115 75,60 Z" fill="#818cf8" opacity="0.35"/>

  <!-- Arching Stem -->
