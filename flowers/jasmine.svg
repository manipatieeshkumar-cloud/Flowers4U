<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Watercolor Wash -->
  <path d="M60,65 Q100,35 140,65 Q175,105 145,150 Q100,175 55,145 Q30,105 60,65 Z" fill="#fef08a" opacity="0.35"/>
  <circle cx="100" cy="100" r="45" fill="#f8fafc" opacity="0.5"/>

  <!-- Star-shaped Pinwheel Petals -->
  <g stroke="#1c1917" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff" fill-opacity="0.9">
    <!-- Petal 1 (Top) -->
    <path d="M100,100 C92,80 88,50 100,35 C112,50 108,80 100,100 Z"/>
    <!-- Petal 2 (Top Right) -->
    <path d="M100,100 C115,88 145,80 158,92 C145,104 118,105 100,100 Z"/>
    <!-- Petal 3 (Bottom Right) -->
    <path d="M100,100 C110,115 130,142 120,158 C108,148 102,120 100,100 Z"/>
    <!-- Petal 4 (Bottom Left) -->
    <path d="M100,100 C88,115 65,138 48,128 C55,115 80,105 100,100 Z"/>
    <!-- Petal 5 (Top Left) -->
    <path d="M100,100 C82,92 55,75 55,58 C70,62 88,82 100,100 Z"/>
  </g>

  <!-- Central Star Tube Eye -->
  <circle cx="100" cy="100" r="8" fill="#fde047" stroke="#1c1917" stroke-width="2"/>
  <circle cx="100" cy="100" r="3" fill="#ca8a04"/>
</svg>