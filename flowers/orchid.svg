<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Lilac Watercolor Wash -->
  <path d="M50,75 C30,95 40,140 70,155 C100,170 140,160 160,135 C175,100 165,65 135,50 C100,35 68,50 50,75 Z" fill="#c084fc" fill-opacity="0.3"/>

  <!-- Sepals (Back Layer) -->
