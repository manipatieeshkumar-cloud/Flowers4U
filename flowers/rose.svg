  <path d="M148,82 C162,102 158,128 138,146" stroke="#2b000b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M58,112 C64,136 86,154 112,154" stroke="#2b000b" stroke-width="2.2" stroke-linecap="round"/>
