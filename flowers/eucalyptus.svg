<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Watercolor Wash -->
  <path d="M85,30 Q120,40 135,80 Q140,130 115,165 Q80,180 70,140 Q65,80 85,30 Z" fill="#a7f3d0" opacity="0.4"/>
  <path d="M75,50 Q115,60 120,110 Q115,150 85,155 Q70,110 75,50 Z" fill="#6ee7b7" opacity="0.3"/>

  <!-- Reddish Woody Stem -->
  <path d="M96,25 Q102,100 100,185" stroke="#78350f" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Round Silver Dollar Eucalyptus Leaves (Paired along stem) -->
  <g stroke="#064e3b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="#bbf7d0" fill-opacity="0.75">
    <!-- Pair 1 (Top) -->
    <ellipse cx="82" cy="45" rx="18" ry="14" transform="rotate(-20 82 45)"/>
    <ellipse cx="116" cy="48" rx="18" ry="14" transform="rotate(20 116 48)"/>

    <!-- Pair 2 -->
    <ellipse cx="76" cy="78" rx="22" ry="17" transform="rotate(-15 76 78)"/>
    <ellipse cx="124" cy="82" rx="22" ry="17" transform="rotate(22 124 82)"/>

    <!-- Pair 3 -->
    <ellipse cx="70" cy="118" rx="25" ry="19" transform="rotate(-18 70 118)"/>
    <ellipse cx="128" cy="122" rx="25" ry="19" transform="rotate(20 128 122)"/>

    <!-- Pair 4 (Bottom) -->
    <ellipse cx="68" cy="155" rx="24" ry="18" transform="rotate(-10 68 155)"/>
    <ellipse cx="132" cy="158" rx="24" ry="18" transform="rotate(15 132 158)"/>
  </g>

  <!-- Leaf Vein Accents -->
  <g stroke="#064e3b" stroke-width="1.8" stroke-linecap="round">
    <path d="M74,78 Q84,78 92,80"/>
    <path d="M124,82 Q114,82 104,81"/>
    <path d="M68,118 Q80,118 90,120"/>
    <path d="M128,122 Q116,122 105,121"/>
  </g>
</svg>